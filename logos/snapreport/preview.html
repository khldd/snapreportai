<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapReport logo pack</title>
<style>
  :root { --blue:#0334EA; --ink:#07132F; --paper:#FCFCFE; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--paper); }
  header { padding:40px clamp(20px,5vw,64px) 8px; }
  h1 { margin:0; font-weight:900; letter-spacing:-.04em; font-size:26px; }
  header p { margin:6px 0 0; color:#5a6478; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; padding:24px clamp(20px,5vw,64px) 64px; }
  figure { margin:0; border:1px solid #e5e8f0; border-radius:14px; overflow:hidden; background:#fff; }
  .art { display:flex; align-items:center; justify-content:center; padding:28px; min-height:150px; }
  .art--ink { background:var(--ink); }
  .art--blue { background:var(--blue); }
  .art img { max-width:100%; max-height:96px; }
  figcaption { padding:12px 16px; border-top:1px solid #eef0f6; font-size:12.5px; color:#5a6478; display:flex; justify-content:space-between; gap:8px; }
  figcaption b { color:var(--ink); font-weight:600; }
  h2 { margin:28px clamp(20px,5vw,64px) 0; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:#8a93a6; }
</style>
</head>
<body>
<header>
  <h1>SnapReport logo pack</h1>
  <p>Vector-true to the site — same mark, same outlined “SnapReport” wordmark, no font dependency. Snap Blue #0334EA · Signal Ink #07132F · Reverse #FFFFFF.</p>
</header>

<h2>Symbol</h2>
<div class="grid">
  <figure><div class="art"><img src="symbol/snapreport-symbol-blue.svg" alt=""></div><figcaption><b>symbol-blue</b><span>#0334EA</span></figcaption></figure>
  <figure><div class="art"><img src="symbol/snapreport-symbol-ink.svg" alt=""></div><figcaption><b>symbol-ink</b><span>#07132F</span></figcaption></figure>
  <figure><div class="art art--blue"><img src="symbol/snapreport-symbol-white.svg" alt=""></div><figcaption><b>symbol-white</b><span>reverse</span></figcaption></figure>
</div>

<h2>Wordmark</h2>
<div class="grid">
  <figure><div class="art"><img src="wordmark/snapreport-wordmark-blue.svg" alt=""></div><figcaption><b>wordmark-blue</b><span>#0334EA</span></figcaption></figure>
  <figure><div class="art"><img src="wordmark/snapreport-wordmark-ink.svg" alt=""></div><figcaption><b>wordmark-ink</b><span>#07132F</span></figcaption></figure>
  <figure><div class="art art--ink"><img src="wordmark/snapreport-wordmark-white.svg" alt=""></div><figcaption><b>wordmark-white</b><span>reverse</span></figcaption></figure>
</div>

<h2>Horizontal lockup — header form</h2>
<div class="grid">
  <figure><div class="art"><img src="lockup-horizontal/snapreport-horizontal-blue.svg" alt=""></div><figcaption><b>horizontal-blue</b><span>#0334EA</span></figcaption></figure>
  <figure><div class="art"><img src="lockup-horizontal/snapreport-horizontal-ink.svg" alt=""></div><figcaption><b>horizontal-ink</b><span>#07132F</span></figcaption></figure>
  <figure><div class="art art--ink"><img src="lockup-horizontal/snapreport-horizontal-white.svg" alt=""></div><figcaption><b>horizontal-white</b><span>reverse</span></figcaption></figure>
</div>

<h2>Stacked lockup — primary / brand moments</h2>
<div class="grid">
  <figure><div class="art"><img src="lockup-stacked/snapreport-stacked-blue.svg" alt=""></div><figcaption><b>stacked-blue</b><span>#0334EA</span></figcaption></figure>
  <figure><div class="art"><img src="lockup-stacked/snapreport-stacked-ink.svg" alt=""></div><figcaption><b>stacked-ink</b><span>#07132F</span></figcaption></figure>
  <figure><div class="art art--blue"><img src="lockup-stacked/snapreport-stacked-white.svg" alt=""></div><figcaption><b>stacked-white</b><span>reverse</span></figcaption></figure>
</div>
</body>
</html>
